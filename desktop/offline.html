<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Praelecta</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: #0e1421; color: #e6ebf5;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 26rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.35rem; letter-spacing: -0.02em; margin: 0 0 .5rem; }
    p { color: #9aa6bf; margin: 0 0 1.5rem; }
    button {
      background: #2e66ff; color: #fff; border: 0; border-radius: 12px;
      padding: .75rem 1.25rem; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2456e0; }
  </style>
</head>
<body>
  <main>
    <h1>Praelecta can’t reach the internet</h1>
    <p>Your recordings and study material live in your account, so the app needs a connection to open them. Check your Wi‑Fi and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => {
      window.location.href = 'https://praelecta.ca';
    });
  </script>
</body>
</html>
