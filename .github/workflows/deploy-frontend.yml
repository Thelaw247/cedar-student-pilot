# Builds the browser app and publishes it to the Cloudflare Worker
# (cedar-student-pilot). Runs on every push to the branches the app is
# served from; server-only commits just republish identical assets, which
# is cheap and keeps the pipeline simple. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   - "Edit Cloudflare Workers" scoped token
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account the Worker lives in
name: Deploy frontend

on:
  push:
    branches: [main, codex/security-and-api-hardening]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (Cloudflare staging mode)
        run: npm run build -- --mode cloudflare
      # Upload the version, then explicitly route 100% of traffic to it.
      # `wrangler deploy` alone was not enough: on 1 Sep the live route stayed
      # on an older version for a day while three CI deploys uploaded fine and
      # served correctly on their preview URLs. Whatever held the old version
      # at 100% (a dashboard rollback or a gradual deployment), an explicit
      # `versions deploy <id>@100%` replaces it. Then the job checks what
      # praelecta.ca actually serves and fails if it is not this build - a
      # green deploy that users never receive is the failure mode to avoid.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          VERSION=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | awk '{print $4}')
          if [ -z "$VERSION" ]; then echo "::error::could not read the uploaded version id"; exit 1; fi
          npx wrangler versions deploy "$VERSION@100%" --yes --message "CI ${GITHUB_SHA::7}"
          echo "--- active deployments ---"
          npx wrangler deployments list | head -30
      - name: Verify praelecta.ca serves this build
        run: |
          EXPECTED=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          echo "expected bundle: $EXPECTED"
          # Cloudflare's edge does not pick up a new version everywhere at once.
          # Two minutes was not always enough (3 Sep: this step went red on a
          # deploy that was live minutes later and correct thereafter), and a
          # red check on a good deploy is how a real failure gets ignored. Five
          # minutes covers the slow propagation without hiding a stuck rollout.
          for i in $(seq 1 20); do
            SERVED=$(curl -s --max-time 20 https://praelecta.ca/ | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1 || true)
            echo "served bundle:   ${SERVED:-none} (attempt $i/20)"
            if [ "$SERVED" = "$EXPECTED" ]; then echo "praelecta.ca is serving this build"; exit 0; fi
            sleep 15
          done
          echo "::error::after 5 minutes praelecta.ca still serves $SERVED, not $EXPECTED - check the active deployment in the Cloudflare dashboard; a version may be pinned at 100%"
          exit 1
