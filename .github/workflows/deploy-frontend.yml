# Builds the browser app and publishes it to the Cloudflare Worker
# (cedar-student-pilot). Runs on every push to the branches the app is
# served from; server-only commits just republish identical assets, which
# is cheap and keeps the pipeline simple. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   - "Edit Cloudflare Workers" scoped token
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account the Worker lives in
name: Deploy frontend

on:
  push:
    branches: [main, codex/security-and-api-hardening]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (Cloudflare staging mode)
        run: npm run build -- --mode cloudflare
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
