name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck -- --pretty false
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      # Resolves every import in mobile/ and shared/. A full `expo export` is
      # the real proof but needs more memory than this runner has; these are the
      # failures that actually happen when adding screens, and they are all
      # statically detectable.
      - name: Check mobile imports resolve
        run: node scripts/check-mobile-imports.mjs
      - name: Check frontend/API route contract
        run: npm run check:api-contract
      - name: Build frontend (Base44 mode)
        run: npm run build
      - name: Build frontend (Supabase staging mode)
        run: npm run build -- --mode cloudflare
        env:
          VITE_BACKEND_MODE: supabase
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_RENDER_API_URL: https://api.example.test
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Audit server dependencies
        run: npm audit --prefix server --audit-level=high
      - name: Test server
        run: npm test --prefix server
