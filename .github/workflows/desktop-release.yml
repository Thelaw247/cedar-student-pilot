# Builds the desktop app (desktop/) for Windows, macOS and Linux and attaches
# the installers to a GitHub Release, which is where the landing page's
# download buttons point:
#
#   https://github.com/Thelaw247/cedar-student-pilot/releases/latest/download/Praelecta-Setup.exe
#   .../releases/latest/download/Praelecta-win.zip
#   .../releases/latest/download/Praelecta-linux.AppImage
#   .../releases/latest/download/Praelecta-linux.deb
#
# macOS is configured in desktop/package.json but deliberately NOT built here:
# nobody can test a .dmg yet, and shipping an installer no one has opened is
# worse than shipping none. Re-add the macos-latest matrix entry to turn it on.
#
# To ship a version: tag the commit `desktop-vX.Y.Z` and push the tag. The
# X.Y.Z becomes the app version. A manual run (workflow_dispatch) builds the
# same installers and keeps them as workflow artifacts without releasing.
#
# Code signing is optional and controlled entirely by repository secrets:
#   macOS   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, and for notarization
#           APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
# Without them the installers still build and run, but Windows SmartScreen and
# most antivirus engines flag an unsigned .exe from an unknown publisher --
# it is the missing signature they object to, not the contents. Praelecta-win.zip
# is the escape hatch until a certificate exists: same app, no installer stub,
# far less likely to be quarantined. Add WIN_CSC_LINK and re-run the tag to sign.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            pattern: |
              desktop/release/Praelecta-Setup.exe
              desktop/release/Praelecta-win.zip
          - os: ubuntu-latest
            name: Linux
            pattern: |
              desktop/release/Praelecta-linux.AppImage
              desktop/release/Praelecta-linux.deb
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm ci --no-audit --no-fund

      # A repository secret that does not exist expands to the empty string, and
      # electron-builder reads an existing-but-empty CSC_LINK as "a certificate
      # is configured": it then tries to import one from an empty path and dies
      # with "<projectDir> not a file" (the macOS job, 3 Sep). So the signing
      # variables are exported only when the secrets actually hold something.
      - name: Configure code signing
        env:
          MAC_LINK: ${{ secrets.CSC_LINK }}
          MAC_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_LINK" ]; then
            printf 'CSC_LINK=%s\n' "$MAC_LINK" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "$MAC_PASSWORD" >> "$GITHUB_ENV"
            echo 'Signing: macOS certificate configured'
          fi
          if [ -n "$WIN_LINK" ]; then
            printf 'WIN_CSC_LINK=%s\n' "$WIN_LINK" >> "$GITHUB_ENV"
            printf 'WIN_CSC_KEY_PASSWORD=%s\n' "$WIN_PASSWORD" >> "$GITHUB_ENV"
            echo 'Signing: Windows certificate configured'
          fi
          if [ -n "$NOTARY_APPLE_ID" ]; then
            printf 'APPLE_ID=%s\n' "$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
            echo 'Notarization: Apple credentials configured'
          fi
          if [ -z "$MAC_LINK" ] && [ -z "$WIN_LINK" ]; then
            echo 'No certificates configured; building unsigned installers.'
          fi

      - name: Build installers
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List output
        run: ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: praelecta-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - name: Checksums
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Praelecta desktop ${{ github.ref_name }}
          files: installers/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
