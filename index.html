<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= on every icon: browsers keep favicons in a private store that
         ignores cache headers and survives a hard reload, so an icon that
         changes at the same path can stay stale for weeks. Bump the number
         whenever the artwork changes. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2E66FF" />
    <!-- No maximum-scale: iOS ignores it for the auto-zoom it does on small
         form fields anyway, and where it IS honoured it blocks a student
         from pinch-zooming a formula or a slide. viewport-fit=cover lets
         the safe-area insets the bottom nav and recording island already
         use actually resolve on a notched phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Praelecta — You show up, we'll do the rest</title>
    <!-- Static fallback for crawlers/scrapers that don't execute JS. Landing.jsx
         overrides this via useEffect for browsers that do (keeps per-page control),
         but the SPA shell needs a real description in the initial HTML too, or a
         non-JS crawler and some social scrapers see nothing here at all. Kept under
         160 chars on purpose - Google truncates past that, mid-sentence, in the
         search snippet. -->
    <meta name="description" content="Record your lecture — Praelecta turns it into a transcript, flashcards, practice questions and a study plan, automatically. Two lectures free." />
    <meta property="og:title" content="Praelecta — You show up, we&#39;ll do the rest" />
    <meta property="og:description" content="Just go to class. We’ll take the notes — transcript, summary and flashcards, minutes after you walk out." />
    <!-- og:image / twitter:image stay absolute deliberately: social scrapers
         (Facebook, LinkedIn, Slack, WhatsApp, iMessage) do not resolve
         relative paths. JPEG, not WebP or PNG: every scraper handles JPEG,
         and at 16KB it is far under WhatsApp's 600KB ceiling, above which it
         silently shows no image at all. Versioned filename because WhatsApp
         caches a preview for days with no way to purge it — publish
         og-card-v2.jpg rather than editing this file in place. Host swapped
         to praelecta.ca now the domain resolves; verified the file serves
         there as image/jpeg before changing this. -->
    <meta property="og:image" content="https://praelecta.ca/og-card-v1.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://praelecta.ca/" />
    <!-- Two hosts serve this identical app - praelecta.ca and the workers.dev
         origin behind it - so without a canonical, search engines see duplicate
         content and pick a winner themselves, which may be the one nobody is
         meant to see. Absolute and hardcoded rather than derived: a canonical
         that points at whatever host served the page tells a crawler nothing. -->
    <link rel="canonical" href="https://praelecta.ca/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://praelecta.ca/og-card-v1.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- JSON-LD: SoftwareApplication schema for rich results / AI answer engines.
         featureList is deliberately exhaustive (every feature the credit system
         bills for, plus the free-form ones) rather than a marketing-copy summary -
         this is the one place on the page built to be read by a machine, not a
         person, so completeness beats brevity here specifically. Keep this in sync
         with server/lib/credits.js FEATURE_COSTS when features are added or renamed. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Praelecta",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web, iOS",
      "url": "https://praelecta.ca/",
      "description": "Praelecta records your lectures and turns them into transcripts, summaries, flashcards, practice questions and a study plan, automatically.",
      "image": "https://praelecta.ca/og-card-v1.jpg",
      "featureList": [
        "Automatic lecture recording with multi-hour, multi-segment capture",
        "Speech-to-text lecture transcription",
        "AI-generated lecture summaries",
        "Transcript-anchored topic outline for every lecture",
        "Concept extraction linked back to the lecture or web sources",
        "Formula extraction, verified against attached professor materials",
        "Key definitions and worked examples pulled from every lecture",
        "Exam topic prediction",
        "Common-misconception detection",
        "Auto-generated practice questions",
        "Multiple-choice review quizzes with a wrong-answers-first review",
        "Flashcard generation",
        "Per-course class handbooks",
        "AI-generated study schedule",
        "To-Do tracking tied to specific lectures",
        "Attach and verify professor-supplied PDFs and materials against a lecture",
        "Automatic class timetable import",
        "Missed-lecture summaries",
        "Smart rebooking for missed study sessions",
        "Project and assignment roadmap planning",
        "Personal study analytics dashboard",
        "Focus mode for study sessions",
        "Semester setup wizard",
        "Free tier plus Student, Scholar and Unlimited subscription tiers",
        "One-time credit packs that never expire"
      ],
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "CAD",
        "lowPrice": "0",
        "highPrice": "24.99",
        "offerCount": "4"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
