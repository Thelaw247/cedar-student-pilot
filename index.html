<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= on every icon: browsers keep favicons in a private store that
         ignores cache headers and survives a hard reload, so an icon that
         changes at the same path can stay stale for weeks. Bump the number
         whenever the artwork changes. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2E66FF" />
    <!-- No maximum-scale: iOS ignores it for the auto-zoom it does on small
         form fields anyway, and where it IS honoured it blocks a student
         from pinch-zooming a formula or a slide. viewport-fit=cover lets
         the safe-area insets the bottom nav and recording island already
         use actually resolve on a notched phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The title names the category first ("lecture recording", "study tool")
         because that is what a student types into a search box; the tagline
         stays in the hero. Kept under 60 characters. src/pages/Landing.jsx sets
         the same string at runtime (LANDING_TITLE) - keep the two equal. -->
    <title>Praelecta | AI Lecture Recording &amp; Study Tool for Students</title>
    <!-- Static fallback for crawlers/scrapers that don't execute JS. Landing.jsx
         overrides this via useEffect for browsers that do (keeps per-page control),
         but the SPA shell needs a real description in the initial HTML too, or a
         non-JS crawler and some social scrapers see nothing here at all. Kept under
         160 chars on purpose - Google truncates past that, mid-sentence, in the
         search snippet. -->
    <meta name="description" content="Record your lecture and Praelecta turns it into a transcript, a summary and flashcards a few minutes later. Two full lectures free, no card." />
    <meta property="og:site_name" content="Praelecta" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:title" content="Praelecta | Just listen. We&#39;ll take the notes." />
    <meta property="og:description" content="Record your lecture and get the transcript, a summary and flashcards a few minutes later. Two full lectures free, no card." />
    <!-- og:image / twitter:image stay absolute deliberately: social scrapers
         (Facebook, LinkedIn, Slack, WhatsApp, iMessage) do not resolve
         relative paths. JPEG, not WebP or PNG: every scraper handles JPEG,
         and at 16KB it is far under WhatsApp's 600KB ceiling, above which it
         silently shows no image at all. Versioned filename because WhatsApp
         caches a preview for days with no way to purge it — publish
         og-card-v2.jpg rather than editing this file in place. Host swapped
         to praelecta.ca now the domain resolves; verified the file serves
         there as image/jpeg before changing this. -->
    <meta property="og:image" content="https://praelecta.ca/og-card-v1.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Praelecta logo and name" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://praelecta.ca/" />
    <!-- Two hosts serve this identical app - praelecta.ca and the workers.dev
         origin behind it - so without a canonical, search engines see duplicate
         content and pick a winner themselves, which may be the one nobody is
         meant to see. Absolute and hardcoded rather than derived: a canonical
         that points at whatever host served the page tells a crawler nothing. -->
    <link rel="canonical" href="https://praelecta.ca/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://praelecta.ca/og-card-v1.jpg" />
    <meta name="twitter:image:alt" content="Praelecta logo and name" />
    <!-- JSON-LD: SoftwareApplication schema for rich results / AI answer engines.
         featureList is deliberately exhaustive (every feature the credit system
         bills for, plus the free-form ones) rather than a marketing-copy summary -
         this is the one place on the page built to be read by a machine, not a
         person, so completeness beats brevity here specifically. Keep this in sync
         with server/lib/credits.js FEATURE_COSTS when features are added or renamed. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Praelecta",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web, Windows, macOS, Linux",
      "url": "https://praelecta.ca/",
      "description": "Praelecta records your lectures and turns them into transcripts, summaries and flashcards, with practice questions, exam prediction and study schedules on paid plans.",
      "image": "https://praelecta.ca/og-card-v1.jpg",
      "featureList": [
        "Lecture recording of up to six hours, with recovery after a crash",
        "Speech-to-text lecture transcription",
        "AI-generated lecture summaries",
        "Transcript-anchored topic outline for every lecture",
        "Concept extraction linked back to the lecture or web sources",
        "Formula extraction, verified against attached professor materials",
        "Key definitions and worked examples pulled from each lecture",
        "Exam topic prediction",
        "Common-misconception detection",
        "Auto-generated practice questions",
        "Multiple-choice review quizzes with a wrong-answers-first review",
        "Flashcard generation",
        "Per-course class handbooks",
        "AI-generated study schedule",
        "To-Do tracking tied to specific lectures",
        "Attach and verify professor-supplied PDFs and materials against a lecture",
        "Automatic class timetable import",
        "Missed-lecture summaries",
        "Smart rebooking for missed study sessions",
        "Project and assignment roadmap planning",
        "Personal study analytics dashboard",
        "Focus mode for study sessions",
        "Semester setup wizard",
        "Free tier plus Student, Scholar and Unlimited subscription tiers",
        "One-time credit packs that never expire"
      ],
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "CAD",
        "lowPrice": "0",
        "highPrice": "79.99",
        "offerCount": "4"
      }
    }
    </script>
    <!-- Organization: who is behind the product, for "what is Praelecta"
         queries. The founder's LinkedIn is the same address shared/founder.js
         holds for the pages (a test keeps them equal); add the company's own
         profiles (Instagram, X) to an Organization-level sameAs as they exist. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Praelecta",
      "url": "https://praelecta.ca/",
      "logo": "https://praelecta.ca/android-chrome-512x512.png",
      "email": "help@praelecta.ca",
      "foundingDate": "2026",
      "founder": { "@type": "Person", "name": "De Wet Luus", "sameAs": "https://www.linkedin.com/in/dewetluus" },
      "address": { "@type": "PostalAddress", "addressLocality": "Saskatoon", "addressRegion": "SK", "addressCountry": "CA" },
      "contactPoint": { "@type": "ContactPoint", "email": "help@praelecta.ca", "contactType": "customer support", "availableLanguage": "en" }
    }
    </script>
    <!-- FAQPage: the same questions the homepage FAQ shows, generated from
         shared/faq.js (server/test/public-site.test.js holds the two equal;
         regenerate this block when that file changes). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is recording lectures allowed?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on your university and your professor: some allow it, some want to be asked first, some don't. Praelecta asks you to confirm you have permission before your first recording in each class, and it never starts a recording on its own."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to my audio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It goes into your account's private storage and is transcribed by Groq (Deepgram as a backup); Google's Gemini then writes the summary, concepts and questions. Those providers process it only to return your results and, under their terms, don't use it to train their models. No other user can see it, we never sell it, and it's deleted when you delete the lecture, the class, or your account."
          }
        },
        {
          "@type": "Question",
          "name": "Will I run out of credits mid-semester?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You always see your balance and what an action costs before you spend it, so it's never a surprise. A one-hour lecture is 10 credits. Student gives you 200 a month (about 20 hours of lectures), Scholar 450, Unlimited 1000. If you need more, a credit pack tops you up without changing your plan, and packs never expire."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel anytime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, from Settings: Manage billing opens Stripe's billing portal, where you cancel yourself, with no email or chat with support. You keep what you paid for until the end of the period, everything you made stays in your account, and your price never goes up while you're subscribed."
          }
        },
        {
          "@type": "Question",
          "name": "Does Praelecta write my essays?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. It works from your lectures and the course files you attach, like a syllabus or a past exam. It doesn't write assignments, and there's nowhere in the app to ask it to."
          }
        },
        {
          "@type": "Question",
          "name": "What if my professor talks too fast?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Record it and replay any part with the transcript right beside it. The summary and key concepts are usually ready about three minutes after you stop recording, so you can listen in class instead of racing to write."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work on iPhone or Mac?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Praelecta runs in the browser on any phone or laptop, iPhone included: sign in at praelecta.ca. There's also a desktop app for Mac, Windows and Linux, and an iPhone app is on the way."
          }
        },
        {
          "@type": "Question",
          "name": "How much does it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Two full lectures of up to 90 minutes are free, no card needed. After that, Student is $7.99 a month or $24.99 for the whole semester, one bill that matches your term. Scholar is $12.99 a month or $39.99 a semester, Unlimited $24.99 or $79.99. The full comparison is on the pricing page."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
